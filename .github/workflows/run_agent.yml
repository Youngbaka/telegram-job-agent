name: Telegram Job Agent

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

jobs:
  run-job-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Job Agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python agent.py

      - name: Commit and push updated seen jobs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Update seen jobs list [skip ci]"
          file_pattern: seen_jobs.txt
